<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Budget - AI Finance Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav>

        <div class="logo">
            AI Finance Assistant
        </div>

        <div class="nav-links">

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/transactions">
                Transactions
            </a>

            <a href="/logout">
                Logout
            </a>

        </div>

    </nav>


    <div class="hero">

        <h1>Set Monthly Budget</h1>

        <br>


        <form method="POST">

            <label>Month</label>

            <br>

            <input
                type="month"
                name="month"
                required
            >

            <br><br>


            <label>Category</label>

            <br>

            <select name="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Transport">
                    Transport
                </option>

                <option value="Shopping">
                    Shopping
                </option>

                <option value="Bills">
                    Bills
                </option>

                <option value="Entertainment">
                    Entertainment
                </option>

                <option value="Health">
                    Health
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

            <br><br>


            <label>Budget Limit</label>

            <br>

            <input
                type="number"
                name="limit_amount"
                placeholder="Enter budget amount"
                step="0.01"
                min="0.01"
                required
            >

            <br><br>


            <button
                type="submit"
                class="btn">

                Save Budget

            </button>

        </form>


        <br><br>

        <hr>

        <br>


        <h2>Saved Budgets</h2>

        <br>


        {% if budgets %}

        <table border="1"
               cellpadding="10"
               cellspacing="0"
               style="margin: auto;">

            <tr>

                <th>
                    Month
                </th>

                <th>
                    Category
                </th>

                <th>
                    Budget Limit
                </th>

            </tr>


            {% for budget in budgets %}

            <tr>

                <td>
                    {{ budget.month }}
                </td>

                <td>
                    {{ budget.category }}
                </td>

                <td>
                    ₹{{ budget.limit_amount }}
                </td>

            </tr>

            {% endfor %}

        </table>

        {% else %}

        <p>
            No budgets found.
        </p>

        {% endif %}

    </div>

</body>

</html>
