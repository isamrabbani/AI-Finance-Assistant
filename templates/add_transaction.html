<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Transaction - AI Finance Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav>

        <div class="logo">
            AI Finance Assistant
        </div>

        <div class="nav-links">

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/transactions">
                Transactions
            </a>

            <a href="/logout">
                Logout
            </a>

        </div>

    </nav>


    <div class="hero">

        <h1>Add Transaction</h1>

        <br>

        <form method="POST">

            <label>Date</label>

            <br>

            <input
                type="date"
                name="date"
                required
            >

            <br><br>


            <label>Description</label>

            <br>

            <input
                type="text"
                name="description"
                placeholder="Example: Swiggy dinner"
                required
            >

            <br><br>


            <label>Amount</label>

            <br>

            <input
                type="number"
                name="amount"
                placeholder="Enter amount"
                step="0.01"
                min="0.01"
                required
            >

            <br><br>


            <label>Type</label>

            <br>

            <select name="type" required>

                <option value="">
                    Select Type
                </option>

                <option value="Income">
                    Income
                </option>

                <option value="Expense">
                    Expense
                </option>

            </select>

            <br><br>


            <label>Category</label>

            <br>

            <select name="category">

                <option value="Other">
                    Other
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Transport">
                    Transport
                </option>

                <option value="Shopping">
                    Shopping
                </option>

                <option value="Bills">
                    Bills
                </option>

                <option value="Entertainment">
                    Entertainment
                </option>

                <option value="Health">
                    Health
                </option>

                <option value="Education">
                    Education
                </option>

            </select>

            <br><br>


            <button type="submit" class="btn">
                Save Transaction
            </button>

        </form>

    </div>

</body>

</html>
